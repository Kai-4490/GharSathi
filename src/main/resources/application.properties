# ===== Server =====
server.port=8080

# ===== PostgreSQL Datasource =====
# Update these to match your local Postgres setup
spring.datasource.url=jdbc:postgresql://localhost:5432/gharsathi_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== App name =====
spring.application.name=gharsathi-alpha

# ===== JWT =====
# This secret is a placeholder for dev only - replace with a long random string before
# anything real touches this. Must be at least 32 characters for HS256.
jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS
jwt.expiration-ms=86400000
